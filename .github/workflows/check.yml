name: Validate TypeScript
on:
  push:
    branches: [main]
  pull_request:
jobs:
  types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package.json
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
